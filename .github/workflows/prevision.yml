name: Comprobar previsión (una vez)
on:
  push:
    branches: [main]
    paths: ["scripts_prevision.py", ".github/workflows/prevision.yml"]
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts_prevision.py
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add analisis/prevision.json; git commit -m "Comparativa de previsión"; for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done
