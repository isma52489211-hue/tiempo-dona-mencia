name: Investigación de fiabilidad (una vez)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/investigar.py"
      - ".github/workflows/investigar.yml"

permissions:
  contents: write

jobs:
  investigar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Descargar y comparar fuentes
        env:
          AEMET_API_KEY: ${{ secrets.AEMET_API_KEY }}
        run: python scripts/investigar.py
      - name: Guardar resultados
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add analisis/ || true
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Resultados de la investigación de fiabilidad"
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done
