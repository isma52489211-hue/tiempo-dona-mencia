name: Datos AEMET Doña Mencía

on:
  schedule:
    - cron: "23 */3 * * *"   # cada 3 horas
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/aemet.py"
      - ".github/workflows/aemet.yml"

permissions:
  contents: write

concurrency:
  group: aemet
  cancel-in-progress: false

jobs:
  descargar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Descargar datos de AEMET
        env:
          AEMET_API_KEY: ${{ secrets.AEMET_API_KEY }}
        run: python scripts/aemet.py
      - name: Guardar cambios
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/aemet.json
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Datos AEMET $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin main && git push
